name: CI Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: [actions/checkout@v4](https://github.com)

      - name: Setup Node.js
        uses: [actions/setup-node@v4](https://github.com)
        with:
          node-version: 20
          cache: 'npm' # Speeds up future builds by caching dependencies

      - name: Install dependencies
        run: npm ci # 'ci' is faster and more reliable than 'install' for automated builds

      - name: Run Build
        run: npm run build # Vite's production build command
